<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coloring Squares</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
    background: #f0f0f0;
  }

  h1 {
    margin-bottom: 20px;
  }

  .color-palette {
    margin-bottom: 15px;
  }

  .color {
    width: 40px;
    height: 40px;
    display: inline-block;
    margin: 5px;
    border: 2px solid #333;
    cursor: pointer;
  }

  .color.selected {
    border: 4px solid #000;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(16, 40px);
    grid-template-rows: repeat(16, 40px);
    gap: 2px;
    justify-content: center;
    margin: 0 auto 20px;
  }

  .square {
    width: 40px;
    height: 40px;
    background-color: #fff;
    border: 1px solid #ddd;
    cursor: pointer;
  }

  button#clear {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>Coloring Squares</h1>

<!-- Color Palette -->
<div class="color-palette" id="palette"></div>

<!-- Grid -->
<div class="grid" id="grid"></div>

<!-- Clear Button -->
<button id="clear">Clear Grid</button>

<script>
  const paletteColors = ['red', 'blue', 'green', 'yellow', 'purple', 'orange', 'pink', 'brown', 'black'];
  const palette = document.getElementById('palette');
  const grid = document.getElementById('grid');
  const clearBtn = document.getElementById('clear');

  let selectedColor = 'black';
  let isDrawing = false;

  // Create color buttons dynamically
  paletteColors.forEach(color => {
    const btn = document.createElement('div');
    btn.classList.add('color');
    btn.style.backgroundColor = color;
    if(color === selectedColor) btn.classList.add('selected');

    btn.addEventListener('click', () => {
      selectedColor = color;
      document.querySelectorAll('.color').forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
    });

    palette.appendChild(btn);
  });

  // Create grid squares
  const gridSize = 16 * 16;
  for(let i = 0; i < gridSize; i++){
    const square = document.createElement('div');
    square.classList.add('square');

    square.addEventListener('mousedown', () => {
      square.style.backgroundColor = selectedColor;
      isDrawing = true;
    });

    square.addEventListener('mouseover', () => {
      if(isDrawing) square.style.backgroundColor = selectedColor;
    });

    grid.appendChild(square);
  }

  // Stop drawing when mouse is released anywhere
  document.body.addEventListener('mouseup', () => isDrawing = false);

  // Clear grid
  clearBtn.addEventListener('click', () => {
    document.querySelectorAll('.square').forEach(sq => sq.style.backgroundColor = '#fff');
  });
</script>

</body>
</html>
