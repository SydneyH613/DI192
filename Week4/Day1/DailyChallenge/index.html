<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Giphy Random Generator</title>
</head>
<body>

  <h1>Random GIF Generator 🎬</h1>

  <!-- Form -->
  <form id="gifForm">
    <input type="text" id="searchInput" placeholder="Enter category (e.g. sun)" required>
    <button type="submit">Get GIF</button>
  </form>

  <!-- Delete All Button -->
  <button id="deleteAll">DELETE ALL</button>

  <!-- Container for GIFs -->
  <div id="gifContainer"></div>

  <script src="script.js"></script>
</body>
</html>
